name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run production browser tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  preview-boundary:
    name: Preview boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build preview application
        run: npm run build
        env:
          VERCEL_ENV: preview

      - name: Verify preview boundary
        run: npm run test:e2e -- tests/e2e/preview-boundary.spec.ts
        env:
          VERCEL_ENV: preview
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start

      - name: Upload preview browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mdez_ci_only
          POSTGRES_DB: mdez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mdez_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MDEZ_TEST_DATABASE_URL: postgres://postgres:mdez_ci_only@127.0.0.1:5432/mdez_test
      MDEZ_CHAIN_DATABASE_URL: postgres://postgres:mdez_ci_only@127.0.0.1:5432/mdez_chain_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Bootstrap disposable databases
        run: psql "$MDEZ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-postgres-bootstrap.sql

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
